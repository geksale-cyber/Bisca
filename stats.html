<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bisca · Statistiche</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root { --bg:#0B0B0D; --surface:#18181B; --surface-2:#232328; --line:#2E2E35; --fg:#FFFFFF; --muted:#A1A1AA; --accent:#5B5FEF; --accent-text:#9A9DFF; --red:#FF6B6B; --sp:#7B7FFF; --mp:#0D9488; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 "Plus Jakarta Sans", system-ui, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; gap: 12px; }
header img { width: 48px; height: 48px; border-radius: 12px; }
header h1 { margin: 0; font-size: 22px; font-weight: 800; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
header .grow { flex: 1; min-width: 0; }
button { font: inherit; cursor: pointer; }
.btn { border: 0; border-radius: 12px; height: 40px; padding: 0 14px; background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.primary { background: var(--accent); box-shadow: none; }
.panel { background: var(--surface); border-radius: 18px; padding: 16px; }
h2 { margin: 0 0 10px; font-size: 13px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--bg); border-radius: 14px; padding: 12px; }
.kpi b { display: block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; }
.chart rect.hit { fill: transparent; }
.chart g.on > * { filter: brightness(1.3); }
.tip { position: absolute; pointer-events: none; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.5); white-space: nowrap; transform: translate(-50%, -100%); top: 0; }
.tip[hidden] { display: none; }
.tip b { display: block; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; padding: 4px 6px 8px; }
td { padding: 8px 6px; border-top: 1px solid var(--line); }
td.n { text-align: right; } th.n { text-align: right; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.pill { font-size: 12px; font-weight: 700; border-radius: 7px; padding: 2px 7px; background: var(--surface-2); color: #D4D4D8; }
.muted { color: var(--muted); }
.login { max-width: 360px; margin: 18vh auto 0; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.login input { height: 50px; border-radius: 12px; border: 0; padding: 0 14px; font: 600 17px inherit; font-family: inherit; color: var(--fg); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); text-align: center; }
.err { color: var(--red); font-size: 14px; }
details summary { cursor: pointer; color: var(--accent-text); font-weight: 700; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<main id="root"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDay = (d) => { const [y, m, g] = d.split('-'); return `${+g}/${+m}`; };
const fmtTs = (t) => new Date(t).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const KEY = 'bisca:statskey';
let key = new URLSearchParams(location.search).get('key');
try { key = key || localStorage.getItem(KEY); } catch {}

function login(err) {
  $('#root').innerHTML = `<form class="login" id="f"><img src="icons/icon-192.png" alt="" style="width:72px;height:72px;border-radius:18px;margin:0 auto"><h1 style="margin:0;font-size:22px">Statistiche di Bisca</h1>
    <p class="muted" style="margin:0">Inserisci la chiave che trovi in wrangler.toml (STATS_KEY).</p>
    <input id="k" autocomplete="off" placeholder="Chiave" value="${esc(key || '')}">${err ? `<p class="err">${esc(err)}</p>` : ''}
    <button class="btn primary" style="height:50px">Apri</button></form>`;
  $('#f').onsubmit = (e) => { e.preventDefault(); key = $('#k').value.trim(); load(); };
}

async function load() {
  if (!key) return login();
  let data;
  try {
    const res = await fetch('api/stats?key=' + encodeURIComponent(key), { cache: 'no-store' });
    if (res.status === 403) { try { localStorage.removeItem(KEY); } catch {} return login('Chiave sbagliata'); }
    data = await res.json();
  } catch { return login('Non riesco a collegarmi al server'); }
  try { localStorage.setItem(KEY, key); } catch {}
  draw(data);
}

function kpi(v, label) { return `<div class="kpi"><b>${v ?? 0}</b><span>${label}</span></div>`; }

function chart(id, rows, series, fmt) {
  const el = document.getElementById(id);
  const W = el.clientWidth || 900, H = 180, top = 10, bottom = 24, left = 26;
  const max = Math.max(1, ...rows.map((r) => series.reduce((a, s) => a + r[s.k], 0)));
  const step = Math.max(1, Math.ceil(max / 4));
  const ticks = []; for (let v = 0; v <= max + step - 1 && ticks.length < 6; v += step) ticks.push(v);
  const yMax = ticks[ticks.length - 1] || 1;
  const bw = (W - left) / rows.length;
  const y = (v) => top + (H - top - bottom) * (1 - v / yMax);
  let g = ticks.map((t) => `<line class="grid" x1="${left}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${left - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('');
  rows.forEach((r, i) => {
    const x = left + i * bw + 2, w = Math.max(2, bw - 4);
    let acc = 0, bars = '';
    series.forEach((s, si) => {
      const v = r[s.k]; if (!v) return;
      const y1 = y(acc + v), y0 = y(acc);
      const h = Math.max(1, y0 - y1 - (acc ? 2 : 0)); // 2px di stacco tra i pezzi
      const last = !series.slice(si + 1).some((n) => r[n.k]);
      bars += last
        ? `<path d="M${x},${y1 + h} V${y1 + 4} Q${x},${y1} ${x + 4},${y1} H${x + w - 4} Q${x + w},${y1} ${x + w},${y1 + 4} V${y1 + h} Z" fill="${s.c}"/>`
        : `<rect x="${x}" y="${y1}" width="${w}" height="${h}" fill="${s.c}"/>`;
      acc += v;
    });
    if (i % 5 === 4 || i === rows.length - 1) g += `<text class="axis" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${fmtDay(r.day)}</text>`;
    g += `<g class="bar" data-i="${i}">${bars}</g><rect class="hit" data-i="${i}" x="${left + i * bw}" y="0" width="${bw}" height="${H - bottom}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico per giorno">${g}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector('.tip');
  el.querySelectorAll('rect.hit').forEach((h) => {
    const show = () => {
      const r = rows[h.dataset.i];
      tip.innerHTML = `<b>${fmtDay(r.day)}</b>${fmt(r)}`;
      const box = el.getBoundingClientRect(), hb = h.getBoundingClientRect();
      tip.style.left = Math.min(box.width - 70, Math.max(70, hb.left - box.left + hb.width / 2)) + 'px';
      tip.hidden = false;
      el.querySelectorAll('g.bar.on').forEach((b) => b.classList.remove('on'));
      el.querySelector(`g.bar[data-i="${h.dataset.i}"]`)?.classList.add('on');
    };
    h.addEventListener('mouseenter', show); h.addEventListener('click', show);
    h.addEventListener('mouseleave', () => { tip.hidden = true; el.querySelector('g.bar.on')?.classList.remove('on'); });
  });
}

const typeName = { sp_start: 'Single player iniziata', sp_end: 'Single player finita', mp_start: 'Multiplayer iniziata', mp_end: 'Multiplayer finita' };

function draw(d) {
  const p = d.people, g = d.games;
  $('#root').innerHTML = `
  <header><img src="icons/icon-192.png" alt=""><div class="grow"><h1>Statistiche di Bisca</h1><p>Aggiornate ${fmtTs(d.updated)}</p></div>
    <button class="btn" id="re">Aggiorna</button></header>
  <section class="panel"><h2>Persone</h2><div class="kpis">
    ${kpi(p.total, 'telefoni in tutto')}${kpi(p.today, 'oggi')}${kpi(p.week, 'ultimi 7 giorni')}${kpi(p.month, 'ultimi 30 giorni')}${kpi(p.installed, "l'hanno messa in Home")}
  </div></section>
  <section class="panel"><h2>Partite</h2><div class="kpis">
    ${kpi(g.spStarted, 'single player iniziate')}${kpi(g.spFinished, 'single player finite')}${kpi(g.rooms, 'stanze create')}${kpi(g.mpStarted, 'multiplayer iniziate')}${kpi(g.mpFinished, 'multiplayer finite')}
    ${kpi(g.avgTable || '–', 'giocatori per tavolo (media)')}${kpi(g.avgHumans || '–', 'persone vere per tavolo')}${kpi(g.rounds, 'turni giocati')}
  </div></section>
  <section class="panel"><h2>Persone al giorno · ultimi 30 giorni</h2><div class="chart" id="c1"></div></section>
  <section class="panel"><h2>Partite al giorno · ultimi 30 giorni</h2>
    <div class="legend"><span><i style="background:var(--sp)"></i>Single player</span><span><i style="background:var(--mp)"></i>Multiplayer</span></div>
    <div class="chart" id="c2"></div>
    <details><summary>Vedi come tabella</summary><table><tr><th>Giorno</th><th class="n">Persone</th><th class="n">Single</th><th class="n">Multi</th></tr>
      ${d.daily.slice().reverse().map((r) => `<tr><td>${fmtDay(r.day)}</td><td class="n">${r.people}</td><td class="n">${r.sp}</td><td class="n">${r.mp}</td></tr>`).join('')}</table></details>
  </section>
  <div class="two">
    <section class="panel"><h2>Chi gioca di più</h2>
      ${d.players.length ? `<table><tr><th>Nome</th><th class="n">Partite</th><th class="n">Ultima</th></tr>${d.players.map((r) => `<tr><td>${esc(r.name)}</td><td class="n">${r.games}</td><td class="n muted">${fmtTs(r.last)}</td></tr>`).join('')}</table>` : '<p class="muted">Ancora nessuna partita.</p>'}
    </section>
    <section class="panel"><h2>Ultime partite</h2>
      ${d.recent.length ? `<table><tr><th>Quando</th><th>Cosa</th><th class="n">Al tavolo</th></tr>${d.recent.map((r) => `<tr><td class="muted">${fmtTs(r.ts)}</td><td>${typeName[r.type] || r.type}${r.name ? ` · ${esc(r.name)}` : ''}${r.rounds ? ` <span class="pill">${r.rounds} turni</span>` : ''}</td><td class="n">${r.players || ''}${r.humans ? ` <span class="muted">(${r.humans} persone)</span>` : ''}</td></tr>`).join('')}</table>` : '<p class="muted">Ancora nessuna partita.</p>'}
    </section>
  </div>
  <p class="muted" style="font-size:12.5px;margin:0">Ogni telefono è contato con un codice a caso salvato nell'app: niente dati personali, solo il nome scelto in gioco. Le partite giocate sulla pagina di Claude non sono contate.</p>`;
  $('#re').onclick = load;
  chart('c1', d.daily, [{ k: 'people', c: 'var(--sp)' }], (r) => `${r.people} ${r.people === 1 ? 'persona' : 'persone'}`);
  chart('c2', d.daily, [{ k: 'sp', c: 'var(--sp)' }, { k: 'mp', c: 'var(--mp)' }], (r) => `Single player ${r.sp}<br>Multiplayer ${r.mp}`);
}

load();
</script>
</body>
</html>

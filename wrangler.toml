name = "bisca"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "GAME"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "ARCHIVE"
class_name = "Archive"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Archive"]

[vars]
PROXY_DELAY_MS = "15000"
CPU_DELAY_MS = "900"
# chiave per la pagina delle statistiche: /stats.html
STATS_KEY = "Uy9XLF7sRgMf"
